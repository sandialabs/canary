name: Publish to PYPI Pipeline

on:
  push:
    tags:
    - "release/*"
  workflow_dispatch:
    inputs:
      hpc_connect_version:
        description: "hpc-connect version to pin for this release (e.g. 26.9.11)"
        required: true
        type: string

env:
  ACTIONS_RUNNER_DEBUG: "true"

jobs:
  publish-to-pypi:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canary-wm
    permissions:
      id-token: write
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.x'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install build

        - name: Build distribution
          run: |
            python -m build

        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
