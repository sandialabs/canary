name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_RUNNER_DEBUG: "true"
  CANARY_TESTING_CPUS: "8"
  CANARY_TESTING_GPUS: "4"

jobs:
  version-check:
    # The date-based version only has to be correct in what actually lands on
    # main (and in what gets published from a release tag).  On pull_request
    # runs, actions/checkout builds an ephemeral merge commit dated "now", so a
    # branch stamped on an earlier day would spuriously fail.  Enforce only on
    # push to main, where HEAD is the real commit with a stable date.  If this
    # fails after main moved ahead, just merge main, re-run `canary check`, and
    # push again.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify pyproject.toml version matches the commit date
        run: |
          set -euo pipefail
          COMMIT_DATE=$(git log -1 --date=short --pretty=format:%ad)
          echo "HEAD commit date: $COMMIT_DATE"
          python - "$COMMIT_DATE" <<'PY'
          import re, sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          y, m, d = sys.argv[1].split("-")
          expected = f"{int(y) - 2000}.{int(m)}.{int(d)}"
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if version != expected:
              raise SystemExit(
                  f"pyproject.toml version {version!r} does not match the commit "
                  f"date {expected!r}. Run `canary check` to update it."
              )
          print(f"pyproject.toml version is current: {version}")
          PY

  unit-tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pytest
        run: |
          pip install .[dev]
          pytest src/canary_cmake/tests
          pytest src/canary_dist/tests
          pytest src/canary_flux/tests
          pytest src/canary_gitlab/tests
          pytest src/canary_hpc/tests
          pytest src/canary_pyt/tests
          pytest src/canary_vvtest/tests
          pytest tests

      - name: Clone and test canary-notebook
        run: |
          git clone https://github.com/sandialabs/canary-notebook.git /tmp/canary-notebook
          pip install /tmp/canary-notebook
          pytest /tmp/canary-notebook/src/canary_notebook/tests

  slurm:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - name: Pull the pre-built Slurm Docker image
       run: |
         docker pull ghcr.io/sandialabs/canary-slurm:latest
     - name: Run Slurm tests
       run: |
         BRANCH_NAME=${GITHUB_REF#refs/heads/}
         echo "Testing branch: $BRANCH_NAME"
         docker run --rm \
           -v /home/runner/work/canary/canary/.ci/slurm/test.sh:/root/test.sh \
           -e BRANCH_NAME=$BRANCH_NAME \
           ghcr.io/sandialabs/canary-slurm:latest \
           /bin/bash -c "./test.sh $BRANCH_NAME"

  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the Flux Docker image
        run: |
          docker pull fluxrm/flux-sched:latest
      - name: Run Flux tests
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Building for branch: $BRANCH_NAME"
          docker run --rm --user root -v /home/runner/work/canary/canary/.ci/flux/test.sh:/home/fluxuser/test.sh -e BRANCH_NAME=$BRANCH_NAME fluxrm/flux-sched:latest env flux start --test-size=3 "./test.sh $BRANCH_NAME"

  pbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the PBS Docker image
        run: |
          docker pull pbspro/pbspro:latest
      - name: Run PBS tests
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Building for branch: $BRANCH_NAME"
          docker run --rm --user root -h pbs -v /home/runner/work/canary/canary/.ci/pbs/test.sh:/tmp/testing/test.sh -e BRANCH_NAME=$BRANCH_NAME -e PBS_START_MOM=1 pbspro/pbspro:latest /tmp/testing/test.sh

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "--version"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install mypy mypy-gitlab-code-quality

      - name: Ruff
        run: |
          ruff format --check --diff
          ruff check --extend-select S324 --show-fixes --exclude=src/canary/__init__.py

      - name: MyPy type checking
        run: |
          pip install .[dev]
          mypy ./src --no-error-summary > mypy-out.txt || true
          mypy-gitlab-code-quality < mypy-out.txt > codequality.json

      - name: Upload Ruff report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.python-version }}
          path: ruff.xml
          retention-days: 30

      - name: Upload CodeQuality report
        uses: actions/upload-artifact@v4
        with:
          name: codequality-report-${{ matrix.python-version }}
          path: codequality.json
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ "$(python -c 'import sys; print(sys.version_info.major * 100 + sys.version_info.minor)')" -lt "311" ]; then
            pip install bandit[toml]
          else
            pip install bandit
          fi

      - name: Bandit
        run: |
          bandit -c pyproject.toml -r src
